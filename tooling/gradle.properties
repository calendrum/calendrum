# Version of the library the tools use; the same value as in the root gradle.properties.
libraryVersion=0.1.0-SNAPSHOT
# Version of the MCP server, written into serverInfo and the names of its archives.
mcpVersion=0.1.0
# Version of the command line, written into --version and the names of its archives.
cliVersion=0.1.0
# Version of the C library, written into calendrum_version and the names of its archives. The ABI has its own number.
sdkCVersion=0.1.0
# Version of the Python package, written into the names and metadata of its wheels by sdk-py/generate.py and build_wheels.py.
sdkPyVersion=0.1.0
# Version of the TypeScript package, written into its package.json and the name of its tarball.
sdkTsVersion=0.1.0
# Version of the .NET package, written into its assembly and the name of its package by sdk-net/generate.py.
sdkNetVersion=0.1.0

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.daemon.jvmargs=-Xmx3g

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
