# Shared setup for every job that runs Gradle. A new workflow copies a job from ci.yml: checkout, this action, Gradle
# tasks by name, reports on failure.

name: Set up the build
description: JDK 21, Gradle and its cache, the Kotlin/Native toolchain cache and CI Gradle settings.

inputs:
  targets:
    description: calendrum.targets for every Gradle call in the job (all, tier1, web, apple, windows, jvm).
    default: all
  konan-cache:
    description: "'true' restores ~/.konan (Kotlin/Native toolchain) and saves it on the default branch."
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '21'

    # Validates the wrapper JAR and writes the cache only on the default branch (both are the defaults of the action).
    # `basic` is MIT-licensed and free for private repositories; the default `enhanced` provider is proprietary (Gradle
    # Technologies Terms of Use) and only a free preview for private repositories.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-provider: basic

    # Private-repository runners have 2 vCPU and 8 GB RAM (Linux, Windows) or 3 CPU and 7 GB (macOS arm64).
    # gradle.properties asks for a 4 GB Gradle daemon plus a 3 GB Kotlin daemon; here one 3 GB Gradle JVM compiles
    # everything in-process. `~/.gradle/gradle.properties` takes precedence over the file of the project.
    - name: Configure Gradle for CI
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        mkdir -p ~/.gradle
        {
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
          echo "kotlin.compiler.execution.strategy=in-process"
          echo "calendrum.targets=$TARGETS"
        } >> ~/.gradle/gradle.properties

    - name: Read the Kotlin version
      id: kotlin
      if: inputs.konan-cache == 'true'
      shell: bash
      run: |
        version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
        if [ -z "$version" ]; then
          echo "::error::No kotlin version in gradle/libs.versions.toml"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # `~/.konan`: the compiler (760 MB unpacked on Linux) plus LLVM and sysroots of the targets the host can link. Keyed
    # by OS, Kotlin version and target set. The downloaded archives are left out: Kotlin/Native only needs the unpacked
    # copies. Saved on the default branch only (schedules run there), like the Gradle cache.
    - name: Cache the Kotlin/Native toolchain
      if: inputs.konan-cache == 'true' && (github.event.repository == null || github.ref_name == github.event.repository.default_branch)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.konan
          !~/.konan/dependencies/cache
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}-${{ inputs.targets }}

    - name: Restore the Kotlin/Native toolchain
      if: inputs.konan-cache == 'true' && !(github.event.repository == null || github.ref_name == github.event.repository.default_branch)
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.konan
          !~/.konan/dependencies/cache
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}-${{ inputs.targets }}
