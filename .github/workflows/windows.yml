# mingwX64 tests on Windows; Windows minutes count x2. Later also on the ci:windows label.
name: Windows

on:
  workflow_dispatch:
  workflow_call:
  # Automatic runs stay off until a maintainer enables them. To enable, uncomment:
  # pull_request:
  #   types: [opened, synchronize, reopened, labeled]
  #   paths-ignore:
  #     - 'docs/**'
  #     - '**/*.md'

permissions:
  contents: read

jobs:
  mingw:
    name: Windows (mingwX64 tests)
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:windows') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:windows'))
    runs-on: windows-2025
    timeout-minutes: 25
    concurrency:
      group: windows-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # windows: only the MinGW toolchain is downloaded, not the Linux and Android ones.
      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          targets: windows
          konan-cache: 'true'

      - name: mingwX64 tests
        run: ./gradlew --continue mingwX64Test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
