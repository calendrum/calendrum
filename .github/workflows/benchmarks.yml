name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile.
        type: choice
        options:
          - quick
          - full
        default: quick
      include:
        description: Regular expression over fully qualified benchmark names (empty runs every suite).
        type: string
        default: ''
  # Automatic runs stay off until a maintainer enables them. To enable, uncomment:
  # schedule:
  #   - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (JVM, JS, Wasm, linuxX64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          targets: all
          konan-cache: 'true'

      - name: Benchmarks
        env:
          PROFILE: ${{ inputs.profile || 'quick' }}
          INCLUDE: ${{ inputs.include }}
        run: |
          args=(--continue ":benchmarks:${PROFILE}Benchmark")
          if [ -n "$INCLUDE" ]; then
            args+=("-Pbench.include=$INCLUDE")
          fi
          ./gradlew "${args[@]}"

      - name: Job summary
        if: always()
        run: |
          summary=benchmarks/build/reports/benchmarks/summary.md
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmarks/build/reports/benchmarks/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-reports
          path: |
            **/build/reports/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
