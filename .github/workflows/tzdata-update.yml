name: Time zone data update

on:
  workflow_dispatch:
    inputs:
      tzdb:
        description: tzdb release, such as 2026e, or latest
        required: false
        default: latest
      cldr:
        description: CLDR release tag, such as release-48, or latest
        required: false
        default: latest
  # Automatic runs stay off until a maintainer enables them. To enable, uncomment:
  # schedule:
  #   - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: tzdata-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update the pinned tzdb and CLDR data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          targets: jvm

      - name: Update the pinned data
        env:
          TZDB: ${{ inputs.tzdb || 'latest' }}
          CLDR: ${{ inputs.cldr || 'latest' }}
        run: |
          third_party/update.sh --tzdb "$TZDB" --cldr "$CLDR" | tee "$RUNNER_TEMP/versions.txt"
          git diff --stat -- third_party | tee "$RUNNER_TEMP/diffstat.txt"
          git diff -- third_party > "$RUNNER_TEMP/third-party.diff"
          {
            echo "## Pinned time zone data"
            echo
            echo '```'
            cat "$RUNNER_TEMP/versions.txt"
            cat "$RUNNER_TEMP/diffstat.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate and test
        run: >-
          ./gradlew --continue -Pcalendrum.targets=jvm :calendrum-core:generateTimeZoneAliases :calendrum-tzdata:generateTzData
          :calendrum-core:jvmTest :calendrum-tzdata:jvmTest :calendrum-core:jvmTestKiritimati checkKotlinAbi

      - name: Upload the update
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tzdata-update
          path: |
            third_party/
            ${{ runner.temp }}/third-party.diff
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tzdata-update-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
