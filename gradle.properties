# Coordinates of all published artifacts; read by the calendrum.publishing convention plugin.
GROUP=io.github.calendrum
VERSION_NAME=0.1.0-SNAPSHOT

# Kotlin targets to configure: all | tier1 | web | apple | windows | jvm. Override with `-Pcalendrum.targets=jvm` or in
# `~/.gradle/gradle.properties`.
calendrum.targets=all

# "report" lists undocumented public declarations; "strict" fails the build on them.
calendrum.kdoc=strict

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+, the comment Android Studio wrote together with the property; Gradle 9.3.1
# ignores it.
org.gradle.tooling.parallel=true
