# Copied into every case. A modest 1 GB Gradle JVM with the Kotlin compiler in-process: a CI runner has 7-8 GB and the
# daemon of the root build is still alive. run.sh also passes this value as -Dorg.gradle.jvmargs, because
# ~/.gradle/gradle.properties (3 GB in CI) takes precedence over the gradle.properties of a project.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
